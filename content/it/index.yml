projekte:
  title: "Lajme dhe Publikime"
  description: "Të rejat më të fundit nga kantieret dhe inovacionet inxhinierike."
faq:
  title: "Pyetjet më të Shpeshta (FAQ)"
  description: "Informacione shtesë mbi procedurat, standardet dhe shërbimet e ofruara nga kompania jonë."
  categories:
    - title: Shërbimet dhe Ekspertiza
      questions:
        - label: Cilat janë shërbimet kryesore që ofroni?
          content: |
            LEAD Consulting ofron një paketë të plotë shërbimesh inxhinierike. Kjo përfshin: projektimin e infrastrukturës rrugore dhe urbane, inxhinieri për parqe fotovoltaike, mbikëqyrje rigoroze të kantiereve të ndërtimit, si dhe kolaudimin ligjor të veprave publike, ushtarake dhe atyre civile.
        - label: A funksiononi ju si një palë e tretë e pavarur?
          content: |
            Po. Integriteti profesional është thelbi ynë. Në proceset e mbikëqyrjes dhe kolaudimit, ne veprojmë si një ent i pavarur, duke garantuar që çdo vepër zbatohet saktësisht sipas projekteve, standardeve të ndërtimit (KTP/KTZ) dhe specifikimeve të investitorit pa konflikt interesi.
        - label: Në cilat fusha të inxhinierisë specializoheni më tepër?
          content: |
            Ekspertiza jonë kryesore shtrihet në zhvillimin e rrjeteve inxhinierike (MEPS, ujësjellës, kanalizime KUZ/KUSH), planifikimin urban për rikualifikime zonash, menaxhimin e aseteve ekoturistike dhe inxhinierinë mjedisore për prodhimin e energjisë së rinovueshme.
    - title: Procedura dhe Kontraktimi
      questions:
        - label: Me çfarë lloj investitorësh bashkëpunoni?
          content: |
            Ne kemi një portofol të dëshmuar suksesi si me institucione ndërkombëtare (p.sh. NSPA/NATO), me autoritete shtetërore e bashki (për ndërtime shkollash dhe sheshesh), ashtu edhe me investitorë të mëdhenj privatë (për industri dhe impiante diellore).
        - label: A merreni me projekte në të gjithë territorin e Shqipërisë?
          content: |
            Po, ashtu siç tregojnë projektet tona nga Përmeti në Spitallë (Durrës) e deri në Kuçovë, skuadra jonë ka kapacitetin logjistik dhe teknik për të dizenjuar, mbikëqyrur dhe operuar kantiere kudo në territorin e Republikës së Shqipërisë.
    - title: Rreth Qasjes Sonë
      questions:
        - label: Çfarë nënkuptoni me "Zhvillim të Qëndrueshëm"?
          content: |
            Për ne, çdo ndërhyrje teknike duhet të respektojë komunitetin dhe natyrën. Kjo reflektohet në dizenjimin masiv të parqeve fotovoltaike për energji të pastër, si dhe në projektet turistike që mbrojnë trashëgiminë natyrore pa cenuar peizazhin ekzistues.
